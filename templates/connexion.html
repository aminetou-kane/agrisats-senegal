{% extends "base.html" %}

{% block titre %}Connexion - AgriSats Sénégal{% endblock %}

{% block contenu %}
<div class="page-etroite">
    <h1>Se connecter</h1>

    {% if erreur %}<p class="message message-erreur" role="alert">{{ erreur }}</p>{% endif %}

    <form method="post" class="formulaire">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="champ">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required>
        </div>
        <div class="champ">
            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-principal btn-large">Se connecter</button>
    </form>
    <p class="note">Pas encore de compte ? <a href="{{ url_for('inscription') }}">Créer un compte</a></p>
</div>
{% endblock %}
