{% extends "base.html" %}

{% block titre %}Créer un compte - AgriSats Sénégal{% endblock %}

{% block contenu %}
<div class="page-etroite">
    <h1>Créer un compte</h1>

    {% if erreur %}<p class="message message-erreur" role="alert">{{ erreur }}</p>{% endif %}

    <form method="post" class="formulaire">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="champ">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" name="nom" maxlength="80" value="{{ nom }}" autocomplete="name" required>
        </div>
        <div class="champ">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" maxlength="120" value="{{ email }}" autocomplete="email" required>
        </div>
        <div class="champ">
            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" name="mot_de_passe" minlength="8" autocomplete="new-password" required aria-describedby="aide-mdp">
            <p class="aide" id="aide-mdp">8 caractères minimum.</p>
        </div>
        <div class="champ">
            <label for="role">Je suis</label>
            <select id="role" name="role" required>
                <option value="">Choisir mon profil</option>
                <option value="producteur" {% if role == "producteur" %}selected{% endif %}>Producteur : je cherche du matériel</option>
                <option value="proprietaire" {% if role == "proprietaire" %}selected{% endif %}>Propriétaire : je loue mon matériel</option>
            </select>
        </div>
        <button type="submit" class="btn btn-principal btn-large">Créer mon compte</button>
    </form>
    <p class="note">Déjà un compte ? <a href="{{ url_for('connexion') }}">Se connecter</a></p>
</div>
{% endblock %}
